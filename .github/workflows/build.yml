name: build

on:
  push:
  pull_request:

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test physics
        if: runner.os == 'Linux'
        run: ./gradlew :core:test
        shell: bash
      - name: Build self-contained desktop app image
        run: ./gradlew :lwjgl3:desktopZip
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: DaggerRidge-${{ matrix.os }}
          path: lwjgl3/build/distributions/*.zip
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DaggerRidge-android-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
